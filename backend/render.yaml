services:
  - type: web
    name: faniq-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FANIQ_DATABASE_URL
        sync: false          # inserisci manualmente nella dashboard Render
      - key: FANIQ_JWT_SECRET
        sync: false
      - key: FANIQ_JWT_EXPIRE_MINUTES
        value: "10080"
      - key: FANIQ_CORS_ORIGINS
        sync: false          # es. https://faniq.vercel.app
      - key: FANIQ_MAX_UPLOAD_MB
        value: "20"
      - key: FANIQ_CACHE_TTL
        value: "120"
      - key: FANIQ_LOG_LEVEL
        value: "INFO"
      - key: FANIQ_FRONTEND_URL
        sync: false          # es. https://faniq.vercel.app — base dei link di recupero password
      - key: FANIQ_SMTP_HOST
        sync: false          # es. smtp-relay.brevo.com
      - key: FANIQ_SMTP_PORT
        value: "587"
      - key: FANIQ_SMTP_USER
        sync: false
      - key: FANIQ_SMTP_PASSWORD
        sync: false
      - key: FANIQ_MAIL_FROM
        sync: false          # es. FanIQ <noreply@dominio.it>
      - key: OPENAI_API_KEY
        sync: false          # opzionale
      - key: PYTHON_VERSION
        value: "3.11.0"
